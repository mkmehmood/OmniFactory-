name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Needed so the "Commit APK to repo" step below can push back to the branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo doesn't include a Gradle wrapper (gradlew), so we install
      # Gradle directly instead of relying on one.
      # AGP 9.1.1 itself reports "Minimum supported Gradle version is
      # 9.3.1", and newer releases like 9.7.x break the Compose compiler
      # plugin ("ComposePluginRegistrar is incompatible with the current
      # version of the compiler"). 9.3.1 is the version that actually works.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # Optional: provide a placeholder .env so the "secrets" gradle plugin
      # has something to read (keeps GEMINI_API_KEY out of the APK unless set).
      - name: Ensure .env exists
        run: cp -n .env.example .env || true

      # debug.keystore is in .gitignore, so it never exists on a fresh
      # checkout. app/build.gradle.kts points the "debugConfig" signing
      # config at ${rootDir}/debug.keystore with password/alias "android" /
      # "androiddebugkey" / "android" — generate one that matches, or
      # assembleDebug fails at :app:validateSigningDebug.
      - name: Generate debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # --no-configuration-cache / --no-build-cache: force Gradle to resolve
      # everything fresh, avoiding stale cached dependency resolution.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-configuration-cache --no-build-cache --refresh-dependencies

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Copies the freshly built APK into the repo itself and pushes it, so
      # it shows up as a normal file in the Code tab (app/release/app-debug.apk)
      # instead of only being reachable through the Actions artifact download.
      # Skipped on pull_request events, since GITHUB_TOKEN generally can't
      # push to PR branches (especially from forks).
      - name: Commit APK to repo
        if: github.event_name != 'pull_request'
        run: |
          set -e
          mkdir -p app/release
          cp app/build/outputs/apk/debug/*.apk app/release/app-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/release/app-debug.apk

          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "chore: update debug APK [skip ci]"
            git push
          fi
