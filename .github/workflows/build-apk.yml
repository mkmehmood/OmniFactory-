name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo doesn't include a Gradle wrapper (gradlew), so we install
      # Gradle directly instead of relying on one. Pinned to 9.1.0 because
      # that's what AGP 9.1.1 was built/tested against — newer Gradle
      # releases (e.g. 9.7.x) can break the Compose compiler plugin
      # ("ComposePluginRegistrar is incompatible with the current version
      # of the compiler").
      # The repo doesn't include a Gradle wrapper (gradlew), so we install
      # Gradle directly instead of relying on one.
      # AGP 9.1.1 itself reports "Minimum supported Gradle version is
      # 9.3.1" — and Gradle 9.7.0 (too new) broke the Compose compiler
      # plugin loading. 9.3.1 is the sweet spot: new enough for AGP,
      # old enough to still be validated against it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # Optional: provide a placeholder .env so the "secrets" gradle plugin
      # has something to read (keeps GEMINI_API_KEY out of the APK unless set).
      - name: Ensure .env exists
        run: cp -n .env.example .env || true

      # debug.keystore is in .gitignore, so it never exists on a fresh
      # checkout. app/build.gradle.kts points the "debugConfig" signing
      # config at ${rootDir}/debug.keystore with password/alias "android" /
      # "androiddebugkey" / "android" — generate one that matches, or
      # assembleDebug fails at :app:validateSigningDebug.
      - name: Generate debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # --no-configuration-cache / --no-build-cache: force Gradle to resolve
      # everything fresh. Rules out a stale cached dependency resolution
      # from earlier runs (with a different Gradle version) being reused.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-configuration-cache --no-build-cache --refresh-dependencies

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
