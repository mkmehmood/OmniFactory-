name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Needed so the "Commit APK to repo" step below can push back to the branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo doesn't include a Gradle wrapper (gradlew), so we install
      # Gradle directly instead of relying on one.
      # AGP 9.1.1 itself reports "Minimum supported Gradle version is
      # 9.3.1", and newer releases like 9.7.x break the Compose compiler
      # plugin ("ComposePluginRegistrar is incompatible with the current
      # version of the compiler"). 9.3.1 is the version that actually works.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # Optional: provide a placeholder .env so the "secrets" gradle plugin
      # has something to read (keeps GEMINI_API_KEY out of the APK unless set).
      - name: Ensure .env exists
        run: cp -n .env.example .env || true

      # debug.keystore should be committed to the repo root (see below) so
      # every build is signed with the SAME key — otherwise each CI run
      # generates a new random one, and Android refuses to install over an
      # existing copy signed with a different key ("package conflicts with
      # an existing package"). This step only generates a fallback keystore
      # if you haven't committed one yet.
      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "No committed debug.keystore found — generating a fallback (builds won't be reinstallable over older ones)."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # --no-configuration-cache / --no-build-cache: force Gradle to resolve
      # everything fresh, avoiding stale cached dependency resolution.
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-configuration-cache --no-build-cache --refresh-dependencies 2>&1 | tee build.log

      # On failure, surface the real compiler / Gradle errors as a single annotation so the cause
      # is visible on the run page (and via the API) without opening the raw log.
      - name: Report build errors
        if: failure()
        run: |
          errs=$(grep -E '^e: |^w: .*error|FAILURE: Build failed|What went wrong|Execution failed for task|Unresolved reference|Type mismatch' -A2 build.log | grep -v '^--$' | head -60 || true)
          errs="${errs//'%'/'%25'}"
          errs="${errs//$'\r'/'%0D'}"
          errs="${errs//$'\n'/'%0A'}"
          echo "::error title=Gradle build errors::${errs:-no error lines found in build.log}"

      # Copies the freshly built APK straight into the repo root and pushes
      # it, so it's a normal file in the Code tab (app-debug.apk) — no need
      # to dig through the Actions artifact list.
      # Skipped on pull_request events, since GITHUB_TOKEN generally can't
      # push to PR branches (especially from forks).
      - name: Commit APK to repo
        if: github.event_name != 'pull_request'
        run: |
          set -e
          cp app/build/outputs/apk/debug/*.apk app-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app-debug.apk

          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "chore: update debug APK [skip ci]"
            git push
          fi
